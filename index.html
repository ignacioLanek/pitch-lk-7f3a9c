<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Lanek Home · Pitch Deck</title>
<style>
  :root { --bg:#0b1020; --panel:#141b30; --txt:#eef2ff; --mut:#8e9ac0; --acc:#3b7bf0; --acc2:#3cc4c8; }
  * { box-sizing:border-box; margin:0; }
  html,body { height:100%; background:var(--bg); color:var(--txt); font-family:-apple-system,"Segoe UI",Roboto,sans-serif; }
  body { display:flex; align-items:center; justify-content:center; padding:16px; }
  #app { width:100%; max-width:1600px; display:grid; grid-template-columns:minmax(0,1fr) 420px; gap:16px; align-items:center; }
  #app.sin-form { grid-template-columns:minmax(0,1fr); }
  #app.sin-form #formulario { display:none; }
  #video { display:flex; flex-direction:column; align-items:center; gap:14px; min-width:0; }
  #formulario { height:calc(100vh - 32px); display:flex; flex-direction:column; background:var(--panel); border-radius:10px; overflow:hidden; }
  #formulario header { display:flex; align-items:center; justify-content:space-between; padding:10px 14px; font-size:14px; font-weight:600; }
  #formulario header button { width:30px; height:30px; font-size:14px; }
  #formulario iframe { flex:1; width:100%; border:0; background:#fff; }
  #escena { position:relative; width:min(100%, calc((100vh - 190px) * 16 / 9)); aspect-ratio:16/9; background:#000; border-radius:10px; overflow:hidden; box-shadow:0 20px 60px rgba(0,0,0,.5); }
  #escena img { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; opacity:0; transition:opacity .6s ease; }
  #escena img.on { opacity:1; }
  .velo { position:absolute; inset:0; display:none; flex-direction:column; align-items:center; justify-content:center; gap:18px; background:rgba(11,16,32,.72); backdrop-filter:blur(6px); text-align:center; padding:20px; }
  .velo.on { display:flex; }
  .velo h1 { font-size:clamp(20px,4vw,38px); font-weight:600; }
  .velo p { color:var(--mut); font-size:clamp(13px,1.8vw,17px); max-width:34em; }
  .grande { border:0; cursor:pointer; color:#fff; font-size:clamp(16px,2.4vw,22px); font-weight:600; padding:.8em 1.8em; border-radius:999px; background:linear-gradient(90deg,var(--acc),var(--acc2)); box-shadow:0 8px 24px rgba(59,123,240,.45); }
  .grande:hover { filter:brightness(1.1); }
  #subs { width:min(100%, calc((100vh - 190px) * 16 / 9)); min-height:3.1em; display:flex; align-items:center; justify-content:center; text-align:center; font-size:clamp(15px,1.7vw,21px); line-height:1.4; padding:0 8px; }
  #subs.off { display:none; }
  #subs span { transition:opacity .2s; }
  #barra { width:min(100%, calc((100vh - 190px) * 16 / 9)); display:flex; align-items:center; gap:10px; }
  #barra button, #formulario header button { border:0; cursor:pointer; background:var(--panel); color:var(--txt); width:42px; height:42px; border-radius:50%; font-size:17px; }
  #barra button:hover, #formulario header button:hover { background:#1e2845; }
  #barra #cc { width:auto; border-radius:999px; padding:0 12px; font-size:13px; font-weight:700; }
  #barra #cc.off { opacity:.45; }
  #barra #vel { width:auto; border-radius:999px; padding:0 12px; font-size:14px; font-variant-numeric:tabular-nums; min-width:54px; }
  #barra #form-btn { width:auto; border-radius:999px; padding:0 14px; font-size:14px; white-space:nowrap; }
  .secundario { border:1px solid #3a4673; background:transparent; color:var(--txt); cursor:pointer; font-size:15px; padding:.65em 1.4em; border-radius:999px; }
  .secundario:hover { background:#1e2845; }
  @media (max-width:900px) {
    body { align-items:flex-start; }
    #app { grid-template-columns:minmax(0,1fr); align-items:start; }
    #formulario { height:85vh; }
    #escena, #barra, #subs { width:100%; }
  }
  #barra button:disabled { opacity:.35; cursor:default; }
  #prog { flex:1; height:6px; background:var(--panel); border-radius:3px; overflow:hidden; }
  #prog i { display:block; height:100%; width:0; background:linear-gradient(90deg,var(--acc),var(--acc2)); transition:width .4s; }
  #num { color:var(--mut); font-size:14px; min-width:3.6em; text-align:right; font-variant-numeric:tabular-nums; }
</style>
</head>
<body>
<div id="app" class="sin-form">
<section id="video">
<div id="escena">
  <img id="a" alt=""><img id="b" alt="">
  <div id="inicio" class="velo on">
    <h1>Lanek Home · Salud más allá del Hospital</h1>
    <p>Una presentación narrada, de unos 10 minutos. Activa el sonido.</p>
    <button class="grande" id="comenzar">▶ Comenzar</button>
  </div>
  <div id="fin" class="velo">
    <h1>Gracias por escuchar</h1>
    <p>Si quieres conversar, estamos a un mensaje de distancia.</p>
    <button class="grande" id="reiniciar">↻ Volver a comenzar</button>
    <button class="secundario" id="fin-form">📝 Responder formulario</button>
  </div>
</div>
<div id="subs" aria-live="off"><span></span></div>
<div id="barra">
  <button id="ant" title="Anterior" aria-label="Anterior">⏮</button>
  <button id="pp" title="Pausar / reanudar" aria-label="Pausar o reanudar">⏸</button>
  <button id="sig" title="Siguiente" aria-label="Siguiente">⏭</button>
  <div id="prog"><i></i></div>
  <span id="num">1 / 20</span>
  <button id="cc" title="Mostrar u ocultar subtítulos" aria-label="Subtítulos">CC</button>
  <button id="vel" title="Velocidad de reproducción" aria-label="Velocidad de reproducción">1×</button>
  <button id="form-btn" title="Mostrar u ocultar el formulario">📝 Formulario</button>
</div>
</section>
<aside id="formulario">
  <header><span>Cuéntanos qué te pareció</span><button id="form-cerrar" title="Ocultar formulario" aria-label="Ocultar formulario">✕</button></header>
  <iframe src="https://docs.google.com/forms/d/e/1FAIpQLSfwbjcsbpcgVx4kOpdIDN6GkgGgWC2bHl-S_dS9dAfUwbuZzA/viewform?embedded=true" title="Formulario" loading="lazy">Cargando…</iframe>
</aside>
</div>
<script>
const N = 20, PAUSA_MS = 900;
const pad = i => String(i + 1).padStart(2, "0");
const $ = id => document.getElementById(id);
const imgs = [$("a"), $("b")];
const audio = new Audio();
let actual = 0, capa = 0, activo = false, espera = null;
const VELOCIDADES = [1, 1.5, 2];
let vel = 1;
audio.defaultPlaybackRate = 1;

// precarga de la siguiente diapositiva y su audio
const cache = {};
function precargar(i) {
  if (i >= N || cache[i]) return;
  const im = new Image(); im.src = `slides/${pad(i)}.webp`;
  const a = new Audio(); a.preload = "auto"; a.src = `audio/${pad(i)}.mp3`;
  cache[i] = [im, a];
}

function mostrar(i) {
  const siguiente = imgs[1 - capa];
  siguiente.src = `slides/${pad(i)}.webp`;
  siguiente.classList.add("on"); imgs[capa].classList.remove("on");
  capa = 1 - capa;
  $("num").textContent = `${i + 1} / ${N}`;
  $("prog").firstElementChild.style.width = `${(i / N) * 100}%`;
  $("ant").disabled = i === 0;
}

function reproducir(i) {
  clearTimeout(espera);
  actual = i; mostrar(i);
  audio.src = `audio/${pad(i)}.mp3`;
  audio.playbackRate = vel;
  audio.play().catch(() => pausar());
  precargar(i + 1);
  $("pp").textContent = "⏸";
}

audio.addEventListener("ended", () => {
  if (!activo) return;
  if (actual === N - 1) { $("prog").firstElementChild.style.width = "100%"; $("fin").classList.add("on"); return; }
  espera = setTimeout(() => reproducir(actual + 1), PAUSA_MS / vel);
});

function pausar() { activo = false; clearTimeout(espera); audio.pause(); $("pp").textContent = "▶"; }
function seguir() {
  activo = true; $("pp").textContent = "⏸";
  if (audio.ended || !audio.src) reproducir(actual); else audio.play();
}
function ir(i) { if (i < 0 || i >= N) return; $("fin").classList.remove("on"); activo = true; reproducir(i); }

$("comenzar").onclick = () => { $("inicio").classList.remove("on"); ir(0); };
$("reiniciar").onclick = () => ir(0);
$("pp").onclick = () => (activo ? pausar() : seguir());
$("vel").onclick = () => {
  vel = VELOCIDADES[(VELOCIDADES.indexOf(vel) + 1) % VELOCIDADES.length];
  audio.defaultPlaybackRate = audio.playbackRate = vel;
  $("vel").textContent = `${vel}×`;
};
$("sig").onclick = () => ir(actual + 1);
$("ant").onclick = () => ir(actual - 1);
document.addEventListener("keydown", e => {
  if ($("inicio").classList.contains("on")) return;
  if (e.code === "Space") { e.preventDefault(); $("pp").click(); }
  if (e.code === "ArrowRight") $("sig").click();
  if (e.code === "ArrowLeft") $("ant").click();
});

// Subtítulos: frases con su tiempo real en el audio (subs.json lo genera construir.py)
let subs = {}, fraseActual = -1, fraseSlide = -1;
fetch("subs.json").then(r => r.json()).then(j => { subs = j; }).catch(() => {});
function subtitulo() {
  const lista = subs[actual + 1];
  if (lista && !$("subs").classList.contains("off")) {
    const t = audio.currentTime;
    let k = -1;
    for (let j = 0; j < lista.length && lista[j][0] <= t + 0.05; j++) k = j;
    if (k !== fraseActual || actual !== fraseSlide) {
      fraseActual = k; fraseSlide = actual;
      $("subs").firstElementChild.textContent = k >= 0 ? lista[k][1] : "";
    }
  }
}
setInterval(subtitulo, 100);
$("cc").onclick = () => {
  const off = $("subs").classList.toggle("off");
  $("cc").classList.toggle("off", off); fraseActual = -1;
};

// Formulario: abierto de entrada en pantallas anchas; en celular, bajo el video al pedirlo
const app = $("app"), ancho = () => matchMedia("(min-width: 901px)").matches;
function formulario(abrir) {
  app.classList.toggle("sin-form", !abrir);
  if (abrir && !ancho()) setTimeout(() => $("formulario").scrollIntoView({ behavior: "smooth" }), 50);
}
$("form-btn").onclick = () => formulario(app.classList.contains("sin-form"));
$("form-cerrar").onclick = () => formulario(false);
$("fin-form").onclick = () => formulario(true);
if (ancho()) formulario(true);

imgs[0].src = "slides/01.webp"; imgs[0].classList.add("on"); $("ant").disabled = true; precargar(1);
</script>
</body>
</html>
